<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Tic-tac-toe</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a14;
        color: #e8e8ff;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        gap: 1.5rem;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #status {
        margin: 0;
        min-height: 1.5em;
        font-size: 1.25rem;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(3, 6rem);
        grid-auto-rows: 6rem;
        gap: 0.5rem;
      }
      .cell {
        border: 2px solid #2b2b4d;
        border-radius: 0.5rem;
        background: #12122a;
        color: inherit;
        font: inherit;
        font-size: 2.5rem;
        cursor: pointer;
      }
      .cell:disabled {
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tic-tac-toe</h1>
      <p id="status" role="status"></p>
      <div id="board"></div>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
