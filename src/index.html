<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Tic-tac-toe</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a14;
        color: #e8e8ff;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        gap: 1.5rem;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #status {
        margin: 0;
        min-height: 1.5em;
        font-size: 1.25rem;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(3, 6rem);
        grid-auto-rows: 6rem;
        gap: 0.5rem;
      }
      .cell {
        border: 2px solid #2b2b4d;
        border-radius: 0.5rem;
        background: #12122a;
        color: inherit;
        font: inherit;
        font-size: 2.5rem;
        cursor: pointer;
      }
      .cell[aria-disabled="true"] {
        cursor: default;
      }
      .cell:focus-visible,
      #restart:focus-visible {
        outline: 3px solid #7df9ff;
        outline-offset: 2px;
      }
      #settings {
        display: flex;
        gap: 1.5rem;
      }
      select {
        padding: 0.25rem 0.5rem;
        border: 2px solid #2b2b4d;
        border-radius: 0.5rem;
        background: #12122a;
        color: inherit;
        font: inherit;
      }
      #scoreboard {
        display: flex;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #restart {
        padding: 0.5rem 1.5rem;
        border: 2px solid #2b2b4d;
        border-radius: 0.5rem;
        background: #12122a;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tic-tac-toe</h1>
      <div id="settings">
        <label>
          Opponent
          <select id="mode">
            <option value="two-player">Two players</option>
            <option value="computer">Computer</option>
          </select>
        </label>
        <label>
          Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="hard">Hard</option>
          </select>
        </label>
      </div>
      <p id="status" role="status"></p>
      <div id="board" role="group" aria-label="Board"></div>
      <ul id="scoreboard" aria-label="Scoreboard">
        <li>X wins: <span id="score-x">0</span></li>
        <li>O wins: <span id="score-o">0</span></li>
        <li>Draws: <span id="score-draws">0</span></li>
      </ul>
      <button id="restart" type="button">Restart</button>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
