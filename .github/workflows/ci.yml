name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t devcontainer .devcontainer

      - name: Hand workspace to container user
        run: |
          sudo chown -R \
            "$(docker run --rm devcontainer sh -c 'echo "$(id -u):$(id -g)"')" \
            "${{ github.workspace }}"

      - name: Run CI checks
        run: |
          docker run --rm \
            -e CI=true \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            devcontainer \
            sh -c '
              set -e
              sh .devcontainer/scripts/post-create.sh
              npm run verify
            '
