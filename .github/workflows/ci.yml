name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency changes
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed=true
          if changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" \
            && ! echo "$changed_files" | grep -qE '(^|/)package(-lock)?\.json$'; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t devcontainer .devcontainer

      - name: Hand workspace to container user
        run: |
          sudo chown -R \
            "$(docker run --rm devcontainer sh -c 'echo "$(id -u):$(id -g)"')" \
            "${{ github.workspace }}"

      - name: Run verify
        run: |
          docker run --rm \
            -e CI=true \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            devcontainer \
            sh -c '
              set -e
              sh .devcontainer/scripts/post-create.sh
              npm run verify
            '

      - name: Run audit
        if: steps.dependencies.outputs.changed == 'true'
        run: |
          docker run --rm \
            -e CI=true \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            devcontainer \
            npm run audit:check
