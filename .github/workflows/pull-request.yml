name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build dev container image
        run: docker build -t devcontainer .devcontainer

      - name: Run CI checks
        run: |
          docker run --rm \
            -e CI=true \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            devcontainer \
            sh -c '
              set -e
              npm ci
              npm run format:check
              npm run typecheck
              npm run lint
              npm test
              npm run build
            '
