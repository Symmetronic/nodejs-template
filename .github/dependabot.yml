version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
