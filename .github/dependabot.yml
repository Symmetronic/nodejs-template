version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
